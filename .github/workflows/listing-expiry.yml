name: Listing Expiry

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  process-expiry:
    runs-on: ubuntu-latest

    steps:
      - name: Process listing expiry
        run: |
          curl --fail-with-body --request POST \
            --header "X-Cron-Secret: ${{ secrets.LISTING_EXPIRY_CRON_SECRET }}" \
            https://farmland-backend-ncnk.onrender.com/internal/listing-expiry